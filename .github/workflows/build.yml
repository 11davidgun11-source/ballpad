name: Build BallPad IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.0
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Bootstrap engine and dependencies
        run: |
          chmod +x scripts/native/*.sh
          scripts/native/bootstrap.sh --platform device

      - name: Apply debug logging patch
        run: |
          python3 scripts/debug-patch.py

      - name: Configure and build (direct cmake)
        run: |
          source scripts/native/common.sh
          BUILD_DIR="${BUILD_ROOT}/device-release"
          LOG="${LOG_DIR}/build-device-release.log"
          mkdir -p "$LOG_DIR"
          JOBS=$(sysctl -n hw.ncpu)

          echo "=== Configuring ==="
          cmake -G Ninja -S "${BALLPAD_ROOT}/mobile" -B "${BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DPORT_DIR="${PORT_DIR}" \
            -DBALLPAD_SDL3_ROOT="${DEPS_ROOT}/sdl3/device" \
            -DBALLPAD_FFMPEG_ROOT="${DEPS_ROOT}/ffmpeg/device" \
            -DBALLPAD_ZSTD_ROOT="${ZSTD_SRC}" \
            -DBALLPAD_PLATFORM=device \
            -DAURORA_DAWN_PROVIDER=vendor \
            -DAURORA_SDL3_PROVIDER=system \
            -DFETCHCONTENT_SOURCE_DIR_DAWN="${DAWN_SRC}" \
            "${DAWN_CACHE_ARGS[@]}"

          echo "=== Building with $JOBS jobs ==="
          cmake --build "${BUILD_DIR}" -j "$JOBS"

      - name: Package IPA
        run: |
          scripts/native/package-release.sh --out build/releases/ballpad-device --source-ref HEAD

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BallPad-unsigned-ipa
          path: |
            build/releases/ballpad-device/**/*.ipa
            build/releases/ballpad-device/**/SHA256SUMS
          if-no-files-found: error
